<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163d50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spanish Pocket"><link rel="manifest" href="manifest.webmanifest"><title>Spanish Pocket Companion</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#173244;background:#f5f7f8}*{box-sizing:border-box}body{margin:0;padding:22px 16px 40px}.app{max-width:460px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:22px;margin:0}small{color:#647785}.panel{background:white;border:1px solid #e1e7eb;border-radius:18px;padding:18px;box-shadow:0 4px 18px #163d5010}label{display:block;font-weight:650;margin:18px 0 8px}select{width:100%;font-size:18px;padding:13px;border-radius:12px;border:1px solid #b9c9d1;background:white;color:#173244}.result{margin-top:22px;padding:22px;border-radius:15px;background:#e7f1f5;text-align:center}.result .word{font-size:44px;font-weight:750;margin:8px}.result .sub{font-size:14px;color:#526b79}.tabs{display:flex;gap:8px}.tabs button{flex:1;border:1px solid #b9c9d1;border-radius:10px;padding:11px;background:white;font-size:15px}.tabs button.active{background:#163d50;color:white}.example{margin-top:16px;line-height:1.5;color:#344c59}.note{margin-top:14px;font-size:13px;color:#627783}.footer{text-align:center;margin-top:24px;font-size:12px;color:#74828b}</style></head><body><main class="app"><header><div><h1>🇵🇪 Spanish Pocket</h1><small>Find the form. Build your sentence.</small></div><span>📖</span></header><section class="panel"><label for="verb">Verb</label><select id="verb"></select><label for="person">Who?</label><select id="person"><option value="0">I</option><option value="1">You (tú)</option><option value="2">He / She / It / You (usted)</option><option value="3">We</option><option value="4">They / You all (ustedes)</option></select><label>When?</label><div class="tabs"><button class="active" data-tense="present">Present</button><button data-tense="past">Past (completed)</button><button data-tense="future">Future</button></div><div class="result" aria-live="polite"><div class="sub">THE FORM YOU NEED</div><div id="answer" class="word">doy</div><div id="description" class="sub"></div></div><div class="example" id="example"></div><div class="note">Past means the completed past (preterite). Future uses the simple future tense. Everyday speech also uses other past and future constructions.</div></section><div class="footer">No account · No adverts · Works offline after installation</div></main><script>
const verbs={dar:['to give',['doy','das','da','damos','dan'],['di','diste','dio','dimos','dieron'],['daré','darás','dará','daremos','darán'],'Te doy un libro.'],tener:['to have',['tengo','tienes','tiene','tenemos','tienen'],['tuve','tuviste','tuvo','tuvimos','tuvieron'],['tendré','tendrás','tendrá','tendremos','tendrán'],'Tengo hambre.'],estar:['to be (state/location)',['estoy','estás','está','estamos','están'],['estuve','estuviste','estuvo','estuvimos','estuvieron'],['estaré','estarás','estará','estaremos','estarán'],'¿Dónde está el Hotel Colón?'],ser:['to be (identity/characteristic)',['soy','eres','es','somos','son'],['fui','fuiste','fue','fuimos','fueron'],['seré','serás','será','seremos','serán'],'Soy de Canadá.'],ir:['to go',['voy','vas','va','vamos','van'],['fui','fuiste','fue','fuimos','fueron'],['iré','irás','irá','iremos','irán'],'Voy a la iglesia.'],hacer:['to do / make',['hago','haces','hace','hacemos','hacen'],['hice','hiciste','hizo','hicimos','hicieron'],['haré','harás','hará','haremos','harán'],'¿Qué haces?'],querer:['to want',['quiero','quieres','quiere','queremos','quieren'],['quise','quisiste','quiso','quisimos','quisieron'],['querré','querrás','querrá','querremos','querrán'],'Quiero aprender español.'],poder:['to be able to',['puedo','puedes','puede','podemos','pueden'],['pude','pudiste','pudo','pudimos','pudieron'],['podré','podrás','podrá','podremos','podrán'],'¿Puedes ayudarme?'],necesitar:['to need',['necesito','necesitas','necesita','necesitamos','necesitan'],['necesité','necesitaste','necesitó','necesitamos','necesitaron'],['necesitaré','necesitarás','necesitará','necesitaremos','necesitarán'],'Necesito agua.'],decir:['to say / tell',['digo','dices','dice','decimos','dicen'],['dije','dijiste','dijo','dijimos','dijeron'],['diré','dirás','dirá','diremos','dirán'],'¿Qué dices?'],saber:['to know (facts)',['sé','sabes','sabe','sabemos','saben'],['supe','supiste','supo','supimos','supieron'],['sabré','sabrás','sabrá','sabremos','sabrán'],'No sé.'],venir:['to come',['vengo','vienes','viene','venimos','vienen'],['vine','viniste','vino','vinimos','vinieron'],['vendré','vendrás','vendrá','vendremos','vendrán'],'¿Vienes mañana?'],hablar:['to speak',['hablo','hablas','habla','hablamos','hablan'],['hablé','hablaste','habló','hablamos','hablaron'],['hablaré','hablarás','hablará','hablaremos','hablarán'],'Hablo un poco de español.'],entender:['to understand',['entiendo','entiendes','entiende','entendemos','entienden'],['entendí','entendiste','entendió','entendimos','entendieron'],['entenderé','entenderás','entenderá','entenderemos','entenderán'],'¿Entiendes?'],comer:['to eat',['como','comes','come','comemos','comen'],['comí','comiste','comió','comimos','comieron'],['comeré','comerás','comerá','comeremos','comerán'],'Quiero comer.']};
const verb=document.getElementById('verb'),person=document.getElementById('person'),answer=document.getElementById('answer'),description=document.getElementById('description'),example=document.getElementById('example');Object.entries(verbs).forEach(([k,v])=>{let o=document.createElement('option');o.value=k;o.textContent=k.toUpperCase()+' · '+v[0];verb.appendChild(o)});let tense='present';function update(){let v=verbs[verb.value],t={present:1,past:2,future:3}[tense];answer.textContent=v[t][Number(person.value)];description.textContent=verb.value.toUpperCase()+' · '+({present:'Present',past:'Completed past',future:'Future'}[tense]);example.innerHTML='<strong>Everyday example:</strong> '+v[4]}document.querySelectorAll('[data-tense]').forEach(b=>b.onclick=()=>{tense=b.dataset.tense;document.querySelectorAll('[data-tense]').forEach(x=>x.classList.toggle('active',x===b));update()});verb.value='dar';verb.onchange=person.onchange=update;update();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
